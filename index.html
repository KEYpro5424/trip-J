<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>旅行のしおり</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;500&family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    'brand-jtb': '#C92434',
                    'brand-orange': '#F97316',
                    'brand-yellow': '#FBBF24',
                    'brand-cyan': '#06B6D4',
                    'brand-sand': '#FEFCE8',
                },
                fontFamily: {
                    'title': ['"Kiwi Maru"', 'serif'],
                    'body': ['"M PLUS Rounded 1c"', 'sans-serif'],
                }
            }
        }
    }
    </script>
    
    <style>
        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            background-color: #F0FDFA;
            background-image: 
                radial-gradient(#CCFBF1 2px, transparent 2px),
                radial-gradient(#CCFBF1 2px, transparent 2px);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            color: #374151;
        }
        
        .title-font {
            font-family: 'Kiwi Maru', serif;
        }

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-6px) rotate(3deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
        .animate-float {
            animation: float 4s ease-in-out infinite;
        }
        
        /* スムーズスクロール */
        html {
            scroll-behavior: smooth;
        }
    </style>
</head>
<body class="pb-24">

<div class="max-w-md mx-auto bg-white/80 backdrop-blur-md min-h-screen shadow-xl overflow-hidden relative border-x border-cyan-50">
    
    <!-- ヘッダー -->
    <header class="relative h-48 bg-gradient-to-br from-cyan-400 via-blue-400 to-blue-500 overflow-hidden rounded-b-[2.5rem] shadow-md z-10 text-white flex flex-col items-center justify-center">
        <div class="absolute top-4 left-6 text-yellow-200 opacity-80 text-4xl animate-float"><i class="fa-solid fa-sun"></i></div>
        <div class="absolute bottom-6 right-8 text-white opacity-40 text-5xl animate-float" style="animation-delay: 1.5s;"><i class="fa-solid fa-cloud"></i></div>
        
        <span class="bg-white/20 backdrop-blur-md text-white text-[10px] font-bold px-3 py-1 rounded-full shadow-sm tracking-widest border border-white/30 mb-2 mt-4">
            TRIP BOOKMARK
        </span>
        <h1 class="text-3xl font-bold mb-1 tracking-wider drop-shadow-md title-font">
            旅行のしおり
        </h1>
    </header>

    <!-- ナビゲーションメニュー（スライド不要・2段配置） -->
    <nav class="px-4 py-6">
        <!-- 上段：3つ -->
        <div class="grid grid-cols-3 gap-3 mb-3">
            <a href="#schedule" class="bg-white rounded-xl p-3 shadow-sm border border-cyan-100 flex flex-col items-center justify-center gap-1 hover:bg-cyan-50 transition">
                <i class="fa-regular fa-calendar-check text-brand-cyan text-xl mb-1"></i>
                <span class="text-xs font-bold text-gray-700">行程表</span>
            </a>
            <a href="#map" class="bg-white rounded-xl p-3 shadow-sm border border-cyan-100 flex flex-col items-center justify-center gap-1 hover:bg-cyan-50 transition">
                <i class="fa-solid fa-map-location-dot text-brand-cyan text-xl mb-1"></i>
                <span class="text-xs font-bold text-gray-700">マップ</span>
            </a>
            <a href="#belongings" class="bg-white rounded-xl p-3 shadow-sm border border-cyan-100 flex flex-col items-center justify-center gap-1 hover:bg-cyan-50 transition">
                <i class="fa-solid fa-suitcase-rolling text-brand-cyan text-xl mb-1"></i>
                <span class="text-xs font-bold text-gray-700">持ち物</span>
            </a>
        </div>
        <!-- 下段：2つ -->
        <div class="grid grid-cols-2 gap-3">
            <a href="#hotel" class="bg-white rounded-xl p-3 shadow-sm border border-cyan-100 flex flex-col items-center justify-center gap-1 hover:bg-cyan-50 transition">
                <i class="fa-solid fa-bed text-brand-cyan text-xl mb-1"></i>
                <span class="text-xs font-bold text-gray-700">ホテル</span>
            </a>
            <button onclick="location.href='meals_top.html'" class="bg-white rounded-xl p-3 shadow-sm border border-brand-orange flex flex-col items-center justify-center gap-1 hover:bg-orange-50 transition relative overflow-hidden group">
                <div class="absolute inset-0 bg-orange-50 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                <i class="fa-solid fa-utensils text-brand-orange text-xl mb-1 relative z-10"></i>
                <span class="text-xs font-bold text-brand-orange relative z-10">食事</span>
            </button>
        </div>
    </nav>

    <div class="px-5 space-y-8 pb-10">
        
        <!-- お天気情報（2日分横並び） -->
        <section>
            <div class="flex items-center gap-2 mb-3">
                <i class="fa-solid fa-cloud-sun text-brand-cyan text-lg"></i>
                <h2 class="text-lg font-bold title-font border-b-2 border-brand-cyan pb-0.5 text-gray-800">お天気予報</h2>
            </div>
            
            <div class="grid grid-cols-2 gap-3">
                <!-- 1日目 山梨 -->
                <div class="bg-white rounded-2xl p-3 shadow-sm border border-blue-50 flex flex-col items-center text-center">
                    <span class="text-[10px] bg-blue-100 text-blue-700 font-bold px-2 py-0.5 rounded-full mb-2">1日目: 山梨</span>
                    <div id="weather-yamanashi-icon" class="text-2xl mb-1 text-gray-300"><i class="fa-solid fa-spinner fa-spin"></i></div>
                    <p id="weather-yamanashi-temp" class="text-xs font-bold text-gray-600">--℃ / --℃</p>
                </div>
                <!-- 2日目 熱海 -->
                <div class="bg-white rounded-2xl p-3 shadow-sm border border-blue-50 flex flex-col items-center text-center">
                    <span class="text-[10px] bg-orange-100 text-orange-700 font-bold px-2 py-0.5 rounded-full mb-2">2日目: 熱海</span>
                    <div id="weather-atami-icon" class="text-2xl mb-1 text-gray-300"><i class="fa-solid fa-spinner fa-spin"></i></div>
                    <p id="weather-atami-temp" class="text-xs font-bold text-gray-600">--℃ / --℃</p>
                </div>
            </div>
        </section>

        <!-- ホテル・Wi-Fi情報 -->
        <section id="hotel">
            <div class="flex items-center gap-2 mb-3">
                <i class="fa-solid fa-wifi text-brand-cyan text-lg"></i>
                <h2 class="text-lg font-bold title-font border-b-2 border-brand-cyan pb-0.5 text-gray-800">ホテル Wi-Fi</h2>
            </div>
            <div class="bg-white rounded-2xl p-5 shadow-sm border border-cyan-100">
                <div class="mb-4">
                    <p class="text-xs text-gray-500 font-bold mb-1">ネットワーク名 (SSID)</p>
                    <div class="bg-gray-50 border border-gray-200 rounded-lg p-2.5 text-sm font-bold text-gray-700 flex justify-between items-center">
                        <span id="wifi-ssid">HOTEL_GUEST_WIFI</span>
                        <button onclick="copyToClipboard('wifi-ssid', this)" class="text-brand-cyan hover:text-cyan-700 bg-cyan-50 px-2 py-1 rounded text-xs transition">
                            <i class="fa-regular fa-copy"></i> コピー
                        </button>
                    </div>
                </div>
                <div>
                    <p class="text-xs text-gray-500 font-bold mb-1">パスワード (Password)</p>
                    <div class="bg-gray-50 border border-gray-200 rounded-lg p-2.5 text-sm font-bold text-gray-700 flex justify-between items-center">
                        <span id="wifi-pass">enjoy_trip2026</span>
                        <button onclick="copyToClipboard('wifi-pass', this)" class="text-brand-cyan hover:text-cyan-700 bg-cyan-50 px-2 py-1 rounded text-xs transition">
                            <i class="fa-regular fa-copy"></i> コピー
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- 行程表 -->
        <section id="schedule">
            <div class="flex items-center gap-2 mb-3">
                <i class="fa-regular fa-calendar-check text-brand-cyan text-lg"></i>
                <h2 class="text-lg font-bold title-font border-b-2 border-brand-cyan pb-0.5 text-gray-800">スケジュール</h2>
            </div>
            <div class="bg-white rounded-2xl p-5 shadow-sm border border-cyan-100">
                <p class="text-sm text-gray-600 font-medium text-center py-4">（ここに行程表の内容が入ります）</p>
            </div>
        </section>

        <!-- マップ -->
        <section id="map">
            <div class="flex items-center gap-2 mb-3">
                <i class="fa-solid fa-map-location-dot text-brand-cyan text-lg"></i>
                <h2 class="text-lg font-bold title-font border-b-2 border-brand-cyan pb-0.5 text-gray-800">マップ</h2>
            </div>
            <div class="bg-white rounded-2xl p-5 shadow-sm border border-cyan-100">
                <p class="text-sm text-gray-600 font-medium text-center py-4">（ここにマップ情報が入ります）</p>
            </div>
        </section>

        <!-- 持ち物 -->
        <section id="belongings">
            <div class="flex items-center gap-2 mb-3">
                <i class="fa-solid fa-suitcase-rolling text-brand-cyan text-lg"></i>
                <h2 class="text-lg font-bold title-font border-b-2 border-brand-cyan pb-0.5 text-gray-800">持ち物リスト</h2>
            </div>
            <div class="bg-white rounded-2xl p-5 shadow-sm border border-cyan-100">
                <p class="text-sm text-gray-600 font-medium text-center py-4">（ここに持ち物リストが入ります）</p>
            </div>
        </section>

    </div>
</div>

<script>
    // クリップボードにコピーする機能
    function copyToClipboard(elementId, btnElement) {
        const text = document.getElementById(elementId).innerText;
        navigator.clipboard.writeText(text).then(() => {
            const originalHtml = btnElement.innerHTML;
            btnElement.innerHTML = '<i class="fa-solid fa-check text-green-500"></i> コピー完了!';
            btnElement.classList.add('bg-green-50');
            setTimeout(() => {
                btnElement.innerHTML = originalHtml;
                btnElement.classList.remove('bg-green-50');
            }, 2000);
        }).catch(err => {
            alert("コピーに失敗しました");
        });
    }

    // 天気予報を取得する機能
    async function fetchWeather() {
        try {
            // 山梨（河口湖付近の緯度経度）
            const resYamanashi = await fetch("https://api.open-meteo.com/v1/forecast?latitude=35.5&longitude=138.76&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=Asia%2FTokyo");
            const dataYamanashi = await resYamanashi.json();
            
            // 熱海（熱海駅付近の緯度経度）
            const resAtami = await fetch("https://api.open-meteo.com/v1/forecast?latitude=35.1&longitude=139.07&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=Asia%2FTokyo");
            const dataAtami = await resAtami.json();

            // WMO Weather code に合わせたアイコン変換
            const getWeatherIcon = (code) => {
                if (code <= 3) return '<i class="fa-solid fa-sun text-orange-400"></i>';
                if (code <= 48) return '<i class="fa-solid fa-cloud text-gray-400"></i>';
                if (code <= 69) return '<i class="fa-solid fa-umbrella text-blue-400"></i>';
                if (code <= 79) return '<i class="fa-solid fa-snowflake text-cyan-300"></i>';
                return '<i class="fa-solid fa-cloud-showers-heavy text-blue-500"></i>';
            };

            // HTMLに反映
            if(dataYamanashi.daily) {
                document.getElementById('weather-yamanashi-icon').innerHTML = getWeatherIcon(dataYamanashi.daily.weathercode[0]);
                document.getElementById('weather-yamanashi-temp').innerText = `${Math.round(dataYamanashi.daily.temperature_2m_max[0])}℃ / ${Math.round(dataYamanashi.daily.temperature_2m_min[0])}℃`;
            }
            if(dataAtami.daily) {
                // 2日目のデータを表示したい場合はインデックス1を使用
                document.getElementById('weather-atami-icon').innerHTML = getWeatherIcon(dataAtami.daily.weathercode[1]);
                document.getElementById('weather-atami-temp').innerText = `${Math.round(dataAtami.daily.temperature_2m_max[1])}℃ / ${Math.round(dataAtami.daily.temperature_2m_min[1])}℃`;
            }
        } catch (error) {
            console.error("天気情報の取得に失敗しました", error);
            document.getElementById('weather-yamanashi-temp').innerText = "取得エラー";
            document.getElementById('weather-atami-temp').innerText = "取得エラー";
        }
    }

    // 画面読み込み時に天気を取得
    window.addEventListener('DOMContentLoaded', fetchWeather);
</script>
</body>
</html>
