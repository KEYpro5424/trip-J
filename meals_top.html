<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>お食事について</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    'brand-jtb': '#C92434',
                },
                fontFamily: {
                    'sans': ['"Zen Maru Gothic"', 'sans-serif'],
                }
            }
        }
    }
    </script>
    
    <style>
        body {
            font-family: 'Zen Maru Gothic', sans-serif;
            background-color: #FFF5F5;
            color: #2D3748;
        }

        /* ぽよんと弾むアニメーション */
        @keyframes bounce-in {
            0% { transform: scale(0.8); opacity: 0; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-bounce-in {
            animation: bounce-in 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0;
        }

        /* 背景のキラキラ */
        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 0.8; transform: scale(1.2); }
        }
        .animate-twinkle {
            animation: twinkle 3s ease-in-out infinite;
        }
    </style>
</head>
<body class="pb-24 flex flex-col min-h-screen">

<!-- ↓ overflow-hidden を削除し、スクロール可能に修正 ↓ -->
<div class="max-w-md mx-auto w-full bg-white/95 backdrop-blur-sm shadow-xl flex-grow flex flex-col relative border-x border-red-50">
    
    <header class="relative h-48 bg-gradient-to-br from-[#FF9A9E] via-[#FECFEF] to-[#FECFEF] overflow-hidden rounded-b-[2.5rem] shadow-sm z-10 text-gray-800 flex flex-col items-center justify-center">
        <!-- 背景装飾 -->
        <div class="absolute top-4 left-6 text-white opacity-60 text-4xl"><i class="fa-solid fa-utensils"></i></div>
        <div class="absolute bottom-6 right-8 text-white opacity-50 text-5xl"><i class="fa-solid fa-mug-hot"></i></div>
        <div class="absolute top-10 right-20 text-yellow-300 text-xl animate-twinkle" style="animation-delay: 0s;"><i class="fa-solid fa-star"></i></div>
        <div class="absolute bottom-10 left-16 text-yellow-300 text-lg animate-twinkle" style="animation-delay: 1.5s;"><i class="fa-solid fa-star"></i></div>

        <!-- 戻るボタン -->
        <a href="index.html" class="absolute top-4 left-4 w-9 h-9 bg-white/40 backdrop-blur-md rounded-full flex items-center justify-center text-gray-700 hover:bg-white/60 transition z-20 shadow-sm border border-white/50">
            <i class="fa-solid fa-chevron-left pr-0.5"></i>
        </a>

        <div class="relative z-10 text-center mt-4">
            <span class="bg-white/60 backdrop-blur-md text-brand-jtb text-xs font-bold px-3 py-1 rounded-full shadow-sm tracking-widest border border-white mb-2 inline-block">
                Meals
            </span>
            <h1 class="text-3xl font-black tracking-wider drop-shadow-sm text-gray-800">
                お食事
            </h1>
        </div>
    </header>

    <!-- ↓ 一番下の余白を pb-20 から pb-32 に増やして固定ボタンとの被りを防止 ↓ -->
    <div class="px-6 py-10 flex flex-col gap-6 flex-grow justify-center pb-32">
        
        <p class="text-center text-sm text-gray-500 font-bold mb-2">どちらのメニューを見ますか？</p>

        <!-- 山梨（夕食）ボタン -->
        <a href="#" class="animate-bounce-in group relative block w-full bg-gradient-to-br from-green-400 to-green-600 rounded-3xl p-1 shadow-lg transform transition active:scale-95" style="animation-delay: 0.1s;">
            <div class="bg-white/10 absolute inset-0 rounded-3xl opacity-0 group-hover:opacity-100 transition"></div>
            <div class="bg-green-50 rounded-[1.3rem] px-5 py-6 flex items-center gap-4 relative overflow-hidden border-2 border-transparent">
                <!-- 装飾 -->
                <div class="absolute -right-4 -bottom-4 text-green-200 text-6xl opacity-30 transform -rotate-12"><i class="fa-solid fa-campground"></i></div>
                
                <div class="w-14 h-14 bg-gradient-to-br from-green-400 to-green-500 rounded-full flex items-center justify-center text-white text-2xl shadow-md z-10 flex-shrink-0">
                    <i class="fa-solid fa-fire-burner"></i>
                </div>
                <div class="z-10">
                    <p class="text-green-600 text-xs font-bold tracking-widest mb-0.5"><i class="fa-solid fa-moon mr-1"></i>Day1 / 夕食</p>
                    <h2 class="text-2xl font-black text-gray-800 tracking-wide">山梨 (BBQ)</h2>
                    <p class="text-[10px] text-gray-500 mt-1 font-bold">メニューは現在準備中です🙇‍♀️</p>
                </div>
                <i class="fa-solid fa-chevron-right absolute right-5 text-green-300 text-xl z-10"></i>
            </div>
        </a>

        <!-- 熱海（昼食）ボタン -->
        <a href="cafe_menu.html" class="animate-bounce-in group relative block w-full bg-gradient-to-br from-cyan-400 to-blue-500 rounded-3xl p-1 shadow-lg transform transition active:scale-95" style="animation-delay: 0.2s;">
            <div class="bg-white/10 absolute inset-0 rounded-3xl opacity-0 group-hover:opacity-100 transition"></div>
            <div class="bg-cyan-50 rounded-[1.3rem] px-5 py-6 flex items-center gap-4 relative overflow-hidden border-2 border-transparent">
                <!-- 装飾 -->
                <div class="absolute -right-4 -bottom-4 text-cyan-200 text-6xl opacity-30 transform -rotate-12"><i class="fa-solid fa-umbrella-beach"></i></div>
                
                <div class="w-14 h-14 bg-gradient-to-br from-cyan-400 to-blue-500 rounded-full flex items-center justify-center text-white text-2xl shadow-md z-10 flex-shrink-0">
                    <i class="fa-solid fa-burger"></i>
                </div>
                <div class="z-10">
                    <p class="text-cyan-600 text-xs font-bold tracking-widest mb-0.5"><i class="fa-solid fa-sun mr-1"></i>Day2 / 昼食</p>
                    <h2 class="text-2xl font-black text-gray-800 tracking-wide">熱海 (初島)</h2>
                    <p class="text-[10px] text-gray-500 mt-1 font-bold">初島カフェのテイクアウトメニュー</p>
                </div>
                <i class="fa-solid fa-chevron-right absolute right-5 text-cyan-300 text-xl z-10"></i>
            </div>
        </a>
        
    </div>

    <!-- 下部ナビゲーション -->
    <div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto p-4 bg-gradient-to-t from-white via-white/90 to-transparent z-20 pb-6">
        <a href="index.html" class="block w-full bg-brand-jtb text-white text-center py-4 rounded-full font-bold shadow-lg hover:bg-red-700 transition flex items-center justify-center gap-2 text-base tracking-wide border-2 border-red-700/50 hover:scale-[0.98] active:scale-95">
            <i class="fa-solid fa-book-open"></i> しおりに戻る
        </a>
    </div>

</div>

</body>
</html>
